name: CI Pipeline

on:
  push:
    branches:
      - develop  # Inicia quando um push for feito na branch develop
  workflow_dispatch: {} # Permite execução manual

jobs:
  build:
    runs-on: ubuntu-latest # O job rodará em uma máquina virtual Ubuntu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Baixa o código do seu repositório

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Define a versão do Node.js

      - name: Install dependencies
        run: npm install # Baixa as dependências do projeto

      - name: Run tests
        run: npm test # Executa os testes